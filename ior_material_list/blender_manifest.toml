schema_version = "1.0.0"

id = "ior_material_list"
version = "1.4.0"
name = "IOR Material List"
tagline = "Searchable IOR list in the Shader Editor sidebar"
maintainer = "Matteo Fontana"
type = "add-on"
website = "https://github.com/mttfntn/ior-material-list-blender"

tags = ["Material", "Node"]

# Supported: Blender 5.3 only (max is exclusive). CI tests exactly this version.
blender_version_min = "5.3.0"
blender_version_max = "5.4.0"

license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Matteo Fontana"]

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc", "/.git/", "*.zip"]
