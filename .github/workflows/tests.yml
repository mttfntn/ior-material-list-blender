name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:      # reused by release.yml

permissions:
  contents: read

jobs:
  test:
    name: Blender ${{ matrix.blender.version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Exactly the supported versions (blender_manifest.toml: 5.3.0 <= v < 5.4.0).
        blender:
          - version: 5.3.0
            sha256: dacb8264197a3f7fda6001285a5a506fc97ee943881261c2c3bd63c882f22e05
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-blender
        with:
          version: ${{ matrix.blender.version }}
          sha256: ${{ matrix.blender.sha256 }}

      - name: Validate manifest
        run: blender --factory-startup --command extension validate ior_material_list

      - name: Unit tests (headless, scratch profile)
        env:
          BLENDER_USER_RESOURCES: ${{ runner.temp }}/blender-profile
        run: blender -b --factory-startup --python-exit-code 1 --python tests/run.py

      - name: Build package
        run: |
          mkdir -p dist
          blender --factory-startup --command extension build --source-dir ior_material_list --output-dir dist

      - name: Install the package into a scratch profile and load it
        env:
          BLENDER_USER_RESOURCES: ${{ runner.temp }}/install-profile
        run: |
          blender --command extension install-file -r user_default -e dist/*.zip
          blender -b --python-exit-code 1 --python-expr "import bpy, sys; m = 'bl_ext.user_default.ior_material_list'; assert m in bpy.context.preferences.addons, 'not enabled'; assert m in sys.modules, 'not loaded'; print('installed add-on loads')"

      - uses: actions/upload-artifact@v4
        with:
          name: ior_material_list-blender-${{ matrix.blender.version }}
          path: dist/*.zip
          retention-days: 3
